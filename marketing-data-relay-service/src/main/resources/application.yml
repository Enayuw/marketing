spring:
  application:
    name: marketing-data-relay-service
  profiles:
    active: pre
  aop:
    proxy-target-class: true
    auto: true
  threadpool:
    queueCapacity: 50000
    # 线程池所使用的缓冲队列
    corePoolSize: 30
    # 线程池维护线程的最少数量
    maxPoolSize: 35
    # 线程池维护线程的最大数量
    keepAliveSeconds: 30000
    # 线程池维护线程所允许的空闲时间
    threadNamePrefix: ThreadPool-Common
    # 线程池所生产的线程名前缀

server:
  port: 18801
  maxHttpPostSize: 209715200
mybatis:
  mapper-locations: mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

#exporter监控
endpoints:
  prometheus:
    enabled: true
    path: /prometheus
    sensitive: false
