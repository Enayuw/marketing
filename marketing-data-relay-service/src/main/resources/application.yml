spring:
  web.interceptors.enabled: true
  application:
    name: marketing-data-relay-service
  profiles.active: pre
  aop:
    proxy-target-class: true
    auto: true
  threadpool:
    queueCapacity: 10000
    # 线程池所使用的缓冲队列
    corePoolSize: 8
    # 线程池维护线程的最少数量
    maxPoolSize: 100
    # 线程池维护线程的最大数量
    keepAliveSeconds: 30000
    # 线程池维护线程所允许的空闲时间
    threadNamePrefix: ThreadPool-Common
    # 线程池所生产的线程名前缀

server:
  port: 18801

#生成结果文件目录
result.file.path: /opt/data/inloan/warning
#exporter监控
endpoints:
  prometheus:
    enabled: true
    path: /prometheus
    sensitive: false