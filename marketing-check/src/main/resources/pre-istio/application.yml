spring:
  web.interceptors.enabled: true
  application:
    name: marketing-check
  profiles.active: pre
  main:
    allow-circular-references: true  # 允许循环依赖
  autoconfigure:
    exclude:
      - com.br.transfer.config.log.Log4j2DynamicAutoConfiguration
      - com.br.transfer.config.log.TempLog4j2DynamicAutoConfiguration
  aop:
   proxy-target-class: true
   auto: true
  lifecycle:
    timeout-per-shutdown-phase: 30s  # 优雅关闭超时时间
  threadpool:
    queueCapacity: 10000
    # 线程池所使用的缓冲队列
    corePoolSize: 8
    # 线程池维护线程的最少数量
    maxPoolSize: 100
    # 线程池维护线程的最大数量
    keepAliveSeconds: 30000
    # 线程池维护线程所允许的空闲时间
    threadNamePrefix: ThreadPool-Common
    # 线程池所生产的线程名前缀
  mail:
    host: mail.brgroup.com
    port: 25
    username: marketing-br@brgroup.com
    password: 1S9D9ocaNwk#
    default-encoding: UTF-8
server:
  port: 19707
  shutdown: graceful  # 启用优雅关闭

mybatis-plus:
  mapper-locations: mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#exporter监控
endpoints:
  prometheus:
    enabled: true
    path: /prometheus
    sensitive: false
#fastDfs配置
fdfs:
  tracker-list:            #TrackerList参数,支持多个
    - 10.100.123.110:22122
  so-timeout: 1501
  connect-timeout: 601
  thumb-image:             #缩略图生成参数
    width: 200
    height: 200
  pool:
    max-total: 500
    max-wait-millis: 150000
    max-total-per-key: 100
