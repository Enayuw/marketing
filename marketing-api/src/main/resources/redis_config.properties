#服务名称
appName=marketing-api
#最大能够保持idel状态的连接数
redis1.max.idle=10
#最小能够保持idel状态的连接数
redis1.min.idle=10
#最大连接数
redis1.max.total=50
#获取连接超时时间
redis1.max.wait.time=6000
#连接获取时是否验证可用性
redis1.test.onBorrow=true
#归还连接时是否可用性
redis1.test.onReturn=false
#空闲连接扫描
redis1.test.whileIdle=true
#连接超时时间
redis1.conn.timeout=1000
#读取超时时间
redis1.read.timeout=1000
#连接超时或者读取超时的重试次数
redis1.max.redirect.count=10

#redis1策略redis集群
redis1.clusterIp=\
  redis-strategy-01.brapp.com:7360,\
  redis-strategy-02.brapp.com:7360,\
  redis-strategy-03.brapp.com:7360


redis2.max.idle=50
redis2.min.idle=10
redis2.max.total=50
redis2.max.wait.time=6000
redis2.test.onBorrow=true
redis2.test.onReturn=false
redis2.test.whileIdle=true

redis2.conn.timeout=1000
redis2.read.timeout=1000
redis2.max.redirect.count=10

#存量redis集群
redis2.clusterIp=\
  redis-strategy-01.brapp.com:7360,\
  redis-strategy-02.brapp.com:7360,\
  redis-strategy-03.brapp.com:7360
