spring:
  application:
    name: marketing-api
  profiles:
    active: prod
  aop:
    proxy-target-class: true
    auto: true
  threadpool:
    queueCapacity: 50000
    # 线程池所使用的缓冲队列
    corePoolSize: 30
    # 线程池维护线程的最少数量
    maxPoolSize: 35
    # 线程池维护线程的最大数量
    keepAliveSeconds: 30000
    # 线程池维护线程所允许的空闲时间
    threadNamePrefix: ThreadPool-Common
    # 线程池所生产的线程名前缀

server:
  port: 18704
  tomcat:
    max-http-form-post-size: 20971520
mybatis:
  mapper-locations: mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    config-url: /compass-api/api/marketing-api/v3/api-docs/swagger-config
    url: /compass-api/api/marketing-api/v3/api-docs
    path: /swagger-ui.html
    disable-swagger-default-url: false

#exporter监控
endpoints:
  prometheus:
    enabled: true
    path: /prometheus
    sensitive: false