spring:
  application:
    name: marketing-inner-api
  profiles:
    active: prod
  aop:
    proxy-target-class: true
    auto: true
  threadpool:
    queueCapacity: 50000
    # 线程池所使用的缓冲队列
    corePoolSize: 30
    # 线程池维护线程的最少数量
    maxPoolSize: 35
    # 线程池维护线程的最大数量
    keepAliveSeconds: 30000
    # 线程池维护线程所允许的空闲时间
    threadNamePrefix: ThreadPool-Common
    # 线程池所生产的线程名前缀

server:
  port: 18704
  maxHttpPostSize: 20971520
mybatis:
  mapper-locations: mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 分页插件配置
pagehelper:
  helperDialect: mysql #标识数据库
  supportMethodsArguments: false #自动分页
  offsetAsPageNum: true
  rowBoundsWithCount: true
  reasonable: true #启用合理化，如果pageNum<1会查询第一页，如果pageNum>pages会查询最后一页
  params: count=countSql
#exporter监控
endpoints:
  prometheus:
    enabled: true
    path: /prometheus
    sensitive: false
#fastDfs配置
fdfs:
  tracker-list:            #TrackerList参数,支持多个
    - compass-fastdfs-cluster2-01.brapp.com:22122
    - compass-fastdfs-cluster2-02.brapp.com:22122
    - compass-fastdfs-cluster2-03.brapp.com:22122
    - compass-fastdfs-cluster2-04.brapp.com:22122
  so-timeout: 1501
  connect-timeout: 601
  thumb-image:             #缩略图生成参数
    width: 200
    height: 200
  pool:
    max-total: 50
    max-wait-millis: 150000
    max-total-per-key: 10