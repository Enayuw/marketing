#操作超时设置，默认30000
operationTimeoutMs=3000
#设置每个统计信息之间的间隔（默认值：60秒）统计信息将以正值激活状态间隔秒数应设置为至少1秒
statsIntervalSeconds=60
#设置用于处理与broker的连接的线程数
numIoThreads=1
#设置要用于消息侦听器的线程数
numListenerThreads=1
#设置客户端库将向单个broker打开的最大连接数
connectionsPerBroker=1
#配置是否在连接上使用延迟tcp,默认为true。无延迟功能确保数据包尽快发送到网络上，实现低延迟发布至关重要。另一方面，发送大量的小数据包可能会限制整体吞吐量
useTcpNoDelay=true
#启用ssl,在serviceurl中使用pulsar+ssl
useTls=false
#设置受信任的TLS证书文件的路径
tlsTrustCertsFilePath=
#配置pulsar客户端是否接受来自broker的不受信任的TLS证书
tlsAllowInsecureConnection=false
#它允许在客户端通过TLS连接到代理时验证主机名验证
tlsHostnameVerificationEnable=false
#允许在每个broker连接上发送的并发查找请求数，以防止代理过载
concurrentLookupRequest=5000
#为防止broker过载，每个broker连接上允许的最大查找请求数
maxLookupRequest=50000
#设置在特定时间段（30秒）内被拒绝的broker请求的最大数目，在此时间段后，当前连接将关闭，客户端将创建一个新连接，以便有机会连接其他broker
maxNumberOfRejectedRequestPerConnection=50
#为每个客户端broker连接设置以秒为单位的心跳检测时间
keepAliveIntervalSeconds=30
#连接时间
connectionTimeoutMs=3000
#增加发送时间参数，单位s
sendTimeout=5

blockIfQueueFull=true

maxPendingMessages=1000

maxPendingMessagesAcrossPartitions=50000

enableBatching=true

batchingMaxMessages=1000

batchingMaxPublishDelayMs=1

enableDeadLetterPolicy=false

maxRedeliverCount=15

negativeAckRedeliveryDelayMs=5

ackTimeout=5

subscriptionInitialPosition=0

priorityLevel=2

receiverQueueSize=1000

maxTotalReceiverQueueSizeAcrossPartitions=50000

replicateSubscriptionState=false

pulsarServiceUrl=pulsar://pre-pulsar3-01.brapp.com:6750,pre-pulsar3-02.brapp.com:6750,pre-pulsar3-03.brapp.com:6750

backupPulsarServiceUrl=pulsar://pre-pulsar3-01-bak.brapp.com:6750,pre-pulsar3-02-bak.brapp.com:6750,pre-pulsar3-03-bak.brapp.com:6750

enableRetry=false

batchIndexAcknowledgmentEnabled=false

failoverCheck = 10

recoveryCheck = 60

switchErrorTimes = 100

switchCheckCycle = 1

isFailoverSwitch=true

patchlogCompressLimit=1048576

#加密
compressType=LZ4
encryptType=AES
encryptKey=51ea7b83baedb7336b17f76b5b2a433bd56ab246923a1875b0bbf9d2da1215cc
