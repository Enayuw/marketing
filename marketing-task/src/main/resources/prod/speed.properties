#默认值false
speed.enable.remote.conf=true
#获取远程配置信息的服务器主机名
#prod
speed.conf_server_host=speed-api.brapp.com
#应用名，必须填写否则抛异常
speed.app=compass_app
#主题名，必须填写否则抛异常
speed.topic=compass_topic
#获取配置文件秘钥，必须填写否则抛异常
#prod
speed.secretkey=552104ad8cbcd5d2ab188c8b908902b5
#环境:test,pre,sim,prod
speed.env=prod
#忽略托管的配置名
speed.ignore
#获取远程配置的重试次数(建议该配置大于等于3,防止网络不稳定等因素获取失败,)
speed.conf_server_url_retry_times=3
#重试时间间隔
speed.conf_server_url_retry_sleep_seconds=1
#远程下载文件的本地下载存储路径
speed.user_define_download_dir=/opt/data/inloan
#是否将配置文件考拷贝到classpath路径下
speed.enable_local_download_dir_in_class_path=false