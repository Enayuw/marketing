#项目英文名
appName=marketing-data-monkey
#资源池最大的空闲连接数
redis1.max.idle=10
#资源池最少的空闲连接数
redis1.min.idle=10
#资源池最大的连接数
redis1.max.total=50
#当连接用尽时，调用者最大等待时间(毫秒)
redis1.max.wait.time=6000
#向连接池借用连接时，是否要进行连接有效性检测（ping），无效连接会被剔除
redis1.test.onBorrow=true
#向连接池归还连接时，是否要进行连接有效性检测（ping），无效连接会被剔除
redis1.test.onReturn=false
#是否开启空闲资源监测
redis1.test.whileIdle=true

redis1.conn.timeout=1000
redis1.read.timeout=1000
redis1.max.redirect.count=10

#redis1集群 生产---
redis1.clusterIp=\
  redis-strategy-01.brapp.com:7340,\
  redis-strategy-02.brapp.com:7340,\
  redis-strategy-03.brapp.com:7340,\
  redis-strategy-04.brapp.com:7340,\
  redis-strategy-05.brapp.com:7340,\
  redis-strategy-06.brapp.com:7340


redis2.max.idle=50
