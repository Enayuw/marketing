redis2.max.total=50
redis2.max.wait.time=6000
redis2.test.onBorrow=true
redis2.test.onReturn=false
redis2.test.whileIdle=true

redis2.conn.timeout=1000
redis2.read.timeout=1000
redis2.max.redirect.count=10

#redis2集群 生产---
redis2.clusterIp=\
 loan-warning-redis-cluster-01.brapp.com:7310,\
 loan-warning-redis-cluster-01.brapp.com:7311,\
 loan-warning-redis-cluster-02.brapp.com:7310,\
 loan-warning-redis-cluster-02.brapp.com:7311