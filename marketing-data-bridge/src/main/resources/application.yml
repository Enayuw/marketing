spring:
  web.interceptors.enabled: true
  application:
    name: marketing-data-bridge
  profiles.include: pre
  main:
    allow-circular-references: true  # 允许循环依赖
  autoconfigure:
    exclude:
      - com.br.transfer.config.log.Log4j2DynamicAutoConfiguration
      - com.br.transfer.config.log.TempLog4j2DynamicAutoConfiguration
  aop:
    proxy-target-class: true
    auto: true
  lifecycle:
    timeout-per-shutdown-phase: 30s  # 优雅关闭超时时间
  threadpool:
    queueCapacity: 10000
    # 线程池所使用的缓冲队列
    corePoolSize: 8
    # 线程池维护线程的最少数量
    maxPoolSize: 100
    # 线程池维护线程的最大数量
    keepAliveSeconds: 30000
    # 线程池维护线程所允许的空闲时间
    threadNamePrefix: ThreadPool-Common
    # 线程池所生产的线程名前缀
  mail:
    host: mail.brgroup.com
    port: 25
    username: marketing-br@brgroup.com
    password: 1S9D9ocaNwk#
    default-encoding: UTF-8
    protocol: imaps
    properties:
      mail.imap.ssl.enable: true
      mail.imap.auth: true


server:
  port: 19809
  shutdown: graceful  # 启用优雅关闭

#生成结果文件目录
result.file.path: /opt/data/inloan/warning
#exporter监控
endpoints:
  prometheus:
    enabled: true
    path: /prometheus
    sensitive: false


# 线程池动态配置监控
tp:
  dynamic:
    metric:
      enabled: true