spring:
  application:
    name: marketing-mq-consumer
  profiles:
    active: pre
  main:
    allow-circular-references: true  # 允许循环依赖
  autoconfigure:
    exclude:
      - com.br.transfer.config.log.Log4j2DynamicAutoConfiguration
      - com.br.transfer.config.log.TempLog4j2DynamicAutoConfiguration
  aop:
   proxy-target-class: true
   auto: true
  lifecycle:
    timeout-per-shutdown-phase: 30s  # 优雅关闭超时时间
  threadpool:
    queueCapacity: 50000
    # 线程池所使用的缓冲队列
    corePoolSize: 30
    # 线程池维护线程的最少数量
    maxPoolSize: 35
    # 线程池维护线程的最大数量
    keepAliveSeconds: 30000
    # 线程池维护线程所允许的空闲时间
    threadNamePrefix: ThreadPool-Common
    # 线程池所生产的线程名前缀

server:
  port: 18705
  tomcat:
    max-http-form-post-size: 20971520
  shutdown: graceful  # 启用优雅关闭

mybatis-plus:
  mapper-locations: mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#exporter监控
endpoints:
  prometheus:
    enabled: true
    path: /prometheus
    sensitive: false